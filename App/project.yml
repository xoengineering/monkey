name: Monkey
packages:
  Monkey:
    path: ..
targets:
  Monkey:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "27.0"
      iOS: "27.0"
    sources:
      - path: Monkey
        excludes:
          - Info.plist
          - Monkey.entitlements
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_NAME: Monkey
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Monkey/Info.plist
        CODE_SIGN_ENTITLEMENTS: Monkey/Monkey.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Monkey
        product: MonkeyCore
      - package: Monkey
        product: MonkeyUI
